name: Maria - Daily Analytics Email

on:
  schedule:
    - cron: '0 12 * * *' # 08:00 America/Santo_Domingo (UTC-4 year-round)
  workflow_dispatch:
    inputs:
      send:
        description: 'Send yesterday report (otherwise read-only test)'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/maria-analytics-daily.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test actual inline Python without credentials or network
        run: python3 tests/test_maria_analytics.py
  send-daily:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch yesterday's stats and send daily email
        env:
          GH_TOKEN: ${{ github.token }}
          SEND_REPORT: ${{ github.event_name == 'schedule' || inputs.send == true }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import html
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from zoneinfo import ZoneInfo

          token = os.environ.get("CF_TOKEN")
          account = os.environ.get("CF_ACCOUNT")
          brevo_key = os.environ.get("BREVO_KEY")
          if not all((token, account, brevo_key)):
              sys.exit("Missing a required GitHub secret or variable.")

          tz = ZoneInfo("America/Santo_Domingo")
          yesterday = dt.datetime.now(tz).date() - dt.timedelta(days=1)
          start = dt.datetime.combine(yesterday, dt.time.min, tzinfo=tz)
          end = start + dt.timedelta(days=1)
          fmt = lambda d: d.astimezone(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          print(f"Reporting date in Dominican Republic: {yesterday}", flush=True)

          query = """
          query MariaAnalytics($account: string, $start: Time, $end: Time) {
            viewer {
              accounts(filter: { accountTag: $account }) {
                rumPageloadEventsAdaptiveGroups(
                  limit: 100
                  filter: { datetime_geq: $start, datetime_lt: $end, requestHost: "by-maria-beauty-store.pages.dev" }
                ) {
                  count
                  sum { visits }
                  dimensions { requestHost }
                }
              }
            }
          }
          """
          def post_json(url, payload, headers, retry=False):
              for attempt in range(3 if retry else 1):
                  req = urllib.request.Request(
                      url, data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json", **headers}, method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if not retry or error.code not in (408, 429, 500, 502, 503, 504) or attempt == 2:
                          raise
                  except (urllib.error.URLError, TimeoutError):
                      if not retry or attempt == 2:
                          raise
                  time.sleep(2 ** (attempt + 1))

          def parse_stats(result):
              if result.get("errors"):
                  raise ValueError("Cloudflare GraphQL error")
              accounts = result["data"]["viewer"]["accounts"]
              if len(accounts) != 1:
                  raise ValueError("Unexpected Cloudflare account response")
              groups = accounts[0]["rumPageloadEventsAdaptiveGroups"]
              if not isinstance(groups, list) or len(groups) >= 100:
                  raise ValueError("Invalid or truncated Cloudflare result")
              views = visits = 0
              for group in groups:
                  if group["dimensions"]["requestHost"] != "by-maria-beauty-store.pages.dev":
                      raise ValueError("Unexpected Cloudflare hostname")
                  count, visit = group["count"], group["sum"]["visits"]
                  if any(type(n) is not int or n < 0 for n in (count, visit)):
                      raise ValueError("Invalid metrics")
                  views += count
                  visits += visit
              return visits, views

          result = post_json(
              "https://api.cloudflare.com/client/v4/graphql",
              {"query": query, "variables": {"account": account, "start": fmt(start), "end": fmt(end)}},
              {"Authorization": f"Bearer {token}"},
              retry=True,
          )
          hostname = "by-maria-beauty-store.pages.dev"
          visits, views = parse_stats(result)
          print(f"Analytics retrieved: visits={visits}, page_views={views}", flush=True)

          date_label = yesterday.strftime("%d/%m/%Y")
          subject = f"Tu resumen diario de visitas - {date_label}"
          body = (
              f"¡Hola, María! ❤️\n\n"
              f"Aquí tienes las estadísticas de tu página web de ayer.\n\n"
              f"Fecha: {date_label}\n"
              f"Visitas: {visits}\n"
              f"Vistas de página: {views}\n\n"
              f"Página: https://{hostname}/\n\n"
              f"Con cariño,\nTu resumen de By María Beauty & Store"
          )
          if os.environ["SEND_REPORT"].lower() != "true":
              print("Read-only test: no email sent.")
              sys.exit(0)
          # Atomic date claim before sending. Never repeat an ambiguous send.
          # Only date and commit SHA are stored; no statistics or recipient data.
          try:
              post_json(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/refs",
                  {"ref": f"refs/tags/maria-analytics-claimed/{yesterday}", "sha": os.environ["GITHUB_SHA"]},
                  {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
              )
          except urllib.error.HTTPError as error:
              if error.code == 422:
                  sys.exit("Date already claimed or ref invalid; no email sent. Check existing claim and Brevo.")
              raise
          response = post_json(
              "https://api.brevo.com/v3/smtp/email",
              {
                  "sender": {"name": "PuntaCanada", "email": "marc.rosemann1@gmail.com"},
                  "to": [{"email": "lacandynocents@gmail.com", "name": "María"}],
                  "subject": subject,
                  "textContent": body,
              },
              {"api-key": brevo_key},
          )
          if not response.get("messageId"):
              sys.exit("Brevo did not return a messageId; verify delivery in Brevo.")
          print("Brevo accepted the daily email. Recipient: lacandynocents@gmail.com", flush=True)
          print("Check Brevo transactional email logs for delivery status.", flush=True)
          PY
