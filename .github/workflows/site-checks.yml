name: Check bilingual website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'i18n.js'
      - 'trenzas.html'
      - 'sitemap.xml'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bilingual page and WhatsApp links
        run: node --test tests/*.test.cjs
